# Rules for the AI remediation agent, split in two ClusterRoles:
#
# ai-remediator-read  -> bound CLUSTER-WIDE (clusterrolebinding.yaml) so the agent
#                        can diagnose anywhere: pods/logs/events/workloads in every
#                        namespace, nodes and node/pod metrics. No secrets, no exec.
# ai-remediator-write -> bound per namespace via RoleBindings (rolebindings.yaml) =
#                        the allow-list. pod delete = "restart"; deployment patch =
#                        rollout-restart annotation + scale. Never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-remediator-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "namespaces", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-remediator-write
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
