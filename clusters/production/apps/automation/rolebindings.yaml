# One RoleBinding per in-scope namespace = the WRITE allow-list (ClusterRole
# ai-remediator-write). Reads are cluster-wide via clusterrolebinding.yaml.
# Adding a namespace here widens what the agent may restart/scale — keep in
# sync with REMEDIATOR_NAMESPACES in n8n.

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-remediator
  namespace: openhab
subjects:
  - kind: ServiceAccount
    name: ai-remediator
    namespace: automation
roleRef:
  kind: ClusterRole
  name: ai-remediator-write
  apiGroup: rbac.authorization.k8s.io
---
