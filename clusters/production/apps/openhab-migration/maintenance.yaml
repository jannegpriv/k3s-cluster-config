# Temporary, activated through Git only after openHAB has stopped.
apiVersion: batch/v1
kind: Job
metadata:
  name: openhab-w6-maintenance
  namespace: openhab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: openhab-w6-maintenance
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-w-5
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: maintenance
          image: alpine:3.18@sha256:de0eb0b3f2a47ba1eb89389859a9bd88b28e82f5826b6969ad604979713c2d4f
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache openssh-client sshpass tar gzip coreutils > /work/packages.log 2>&1 || { tail -30 /work/packages.log; exit 1; }
              touch /work/ready
              echo "Maintenance tools ready; openHAB is not started"
              sleep 3500
          env:
            - name: NAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nas-credentials
                  key: password
          readinessProbe:
            exec:
              command: ["test", "-f", "/work/ready"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: conf
              mountPath: /data/conf
            - name: userdata
              mountPath: /data/userdata
            - name: addons
              mountPath: /data/addons
            - name: karaf
              mountPath: /data/karaf
            - name: work
              mountPath: /work
            - name: known-hosts
              mountPath: /ssh
              readOnly: true
      volumes:
        - name: conf
          persistentVolumeClaim:
            claimName: openhab-production-conf-claim
        - name: userdata
          persistentVolumeClaim:
            claimName: openhab-production-userdata-claim
        - name: addons
          persistentVolumeClaim:
            claimName: openhab-production-addons-claim
        - name: karaf
          persistentVolumeClaim:
            claimName: openhab-production-karaf-claim
        - name: work
          emptyDir:
            sizeLimit: 4Gi
        - name: known-hosts
          configMap:
            name: openhab-migration-nas-hostkey
