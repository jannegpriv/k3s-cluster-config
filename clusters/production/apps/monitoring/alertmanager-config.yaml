apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: k3s-silences
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: "null"
    routes:
      # Dead-man's-switch (2026-07-23): the always-firing Watchdog pings
      # healthchecks.io every ~3 min; missing pings page Janne externally.
      # FIRST route + continue: false — Watchdog goes nowhere else.
      - receiver: "deadmans-switch"
        matchers:
          - name: alertname
            value: DeadMansSwitch
        groupWait: 0s
        groupInterval: 1m
        repeatInterval: 3m
        continue: false
      # Silence the embedded component alerts in k3s
      - receiver: "null"
        matchers:
          - name: alertname
            value: KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown|K3sServiceDown|ApiServerHighLatency|ApiServerCriticalLatency
            regex: true
        continue: false
      # Silence TargetDown for kube-proxy (expected in k3s - components are embedded)
      - receiver: "null"
        matchers:
          - name: alertname
            value: TargetDown
          - name: job
            value: kube-proxy
        continue: false
      # AI remediator route moved 2026-10-03 to alertmanager-email-config.yaml
      # (global config). Here the operator scoped it to namespace="monitoring",
      # so the agent never saw alerts from other namespaces.
      # critical-alerts/warning-alerts removed 2026-10-03: they duplicated the
      # global alertmanager-config n8n-webhook route (same /webhook/alertmanager),
      # so namespace=monitoring alerts were posted twice to Mattermost.

  receivers:
    - name: "null"
    - name: "deadmans-switch"
      webhookConfigs:
        - urlSecret:
            name: deadmans-switch
            key: url
          sendResolved: false
