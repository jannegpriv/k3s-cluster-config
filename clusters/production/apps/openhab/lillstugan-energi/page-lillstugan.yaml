                          r4Label: Strängspänning
                          r4Item: SigenStor_PV1_Voltage
                          r5Label: Strängeffekt
                          r5Item: SigenStor_PV1_Power
                          r6Label: Växelriktarstatus
                          r6Item: SigenStor_Inv_State
                - component: oh-grid-col
                  config:
                    width: "100"
                    medium: "100"
                    xlarge: "33"
                  slots:
                    default:
                      - component: widget:lillstugan_kort
                        config:
                          title: Elnät
                          mainItem: SigenStor_Grid_Power
                          badgeItem: Lillstugan_Badge_Nat
                          r1Label: Köpt idag
                          r1Item: SigenStor_Import_Today
