                          r7Item: SigenStor_Phase_B_Power
                          r8Label: Fas C
                          r8Item: SigenStor_Phase_C_Power
    - component: oh-block
      config: {}
      slots:
        default:
          - component: oh-grid-row
            config: {}
            slots:
              default:
