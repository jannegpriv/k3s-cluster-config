# Main UI layout page "Lillstugan just nu" (uid: lillstugan_just_nu). Homey-style energy
# overview for Lillstugan (Landet, Glava) built from the SigenStor items mirrored into
# Huddinge, plus the Lynk & Co 08. One widget per oh-grid-col (a col renders only its
# first child). Read-only: no controls. Deploy with scripts/lillstugan-energi-deploy.sh.
# Separate from the "Solel", "Solel Historik" and "SigenStor AI Utvärdering" pages.
uid: lillstugan_just_nu
tags:
  - lillstugan
props:
  parameters: []
  parameterGroups: []
component: oh-layout-page
config:
  label: Lillstugan just nu
  sidebar: true
  order: "60"
slots:
  default:
    - component: oh-block
      config: {}
      slots:
        default:
          - component: oh-grid-row
            config: {}
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                  slots:
                    default:
                      - component: widget:lillstugan_hero
                        config: {}
    - component: oh-block
      config: {}
      slots:
        default:
          - component: oh-grid-row
            config: {}
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    medium: "50"
                    xlarge: "33"
                  slots:
                    default:
                      - component: widget:lillstugan_kort
                        config:
                          title: SigenStor 18 kWh
                          mainItem: SigenStor_Battery_SOC
                          badgeItem: Lillstugan_Badge_Batteri
