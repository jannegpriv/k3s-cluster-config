# Main UI layout page "Kameror Landet" (uid: cameras_landet).
# Paste into Main UI: Settings > Pages > + > Layout page > Code tab, or POST via
# scripts/camera-bridge-page.sh. URLs are same-origin (relative), so the page
# works on every openHAB URL the user uses (NodePort, openhab.local, k3s.nu)
# and never exposes camera addresses or credentials to the browser.
#
# C720: video card, startManually - user presses play.
# C425s (battery): toggle card = stream ON/OFF. Player is only rendered once
# cameras.rules has confirmed the playlist exists (*_Ready); otherwise a still.
uid: cameras_landet
tags:
  - cameras
props:
  parameters: []
  parameterGroups: []
timestamp: Sep 12, 2026, 1:30:00 PM
component: oh-layout-page
config:
  label: Kameror
  sidebar: true
slots:
  default:
    - component: oh-block
      config:
        title: Lillstugan
      slots:
        default:
          - component: oh-grid-row
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-video-card
                        config:
                          title: Lillstugan – C720
                          footer: HLS via openHAB (~5–10 s fördröjning). Tryck play för att starta.
                          url: /ipcamera/c720_lillstugan/ipcamera.m3u8
                          type: application/x-mpegURL
                          startManually: true
                          startMuted: true
                          hideControls: false
                          playerType: videojs
                          posterURL: /static/camera-idle.jpg
                      - component: oh-toggle-card
                        config:
                          title: Permanent ström (nätdriven kamera)
                          item: C720_Lillstugan_PermanentStream
                          footer: PÅ = strömmen hålls igång hela tiden, start utan fördröjning.
    - component: oh-block
      config:
        title: Landet baksida
      slots:
        default:
          - component: oh-grid-row
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-toggle-card
                        config:
                          title: Landet baksida – C425
                          item: C425_LandetBaksida_PermanentStream
                          footer: Batterikamera – PÅ väcker kameran (~10–30 s till bild), AV efter max 2 min.
                      - component: oh-image-card
                        config:
                          url: /static/camera-idle.jpg
                          footer: Kameran sover. Slå PÅ strömmen ovan för att titta.
                          visible: =items.C425_LandetBaksida_PermanentStream.state != 'ON'
                      - component: oh-label-card
                        config:
                          label: Väcker kameran…
                          icon: f7:hourglass
                          footer: Bilden kommer när strömmen är igång (10–30 s).
                          visible: =items.C425_LandetBaksida_PermanentStream.state == 'ON' && items.C425_LandetBaksida_Ready.state != 'ON'
                      - component: oh-video-card
                        config:
                          title: Landet baksida – C425
                          footer: Live (HLS, ~5–10 s fördröjning). Stängs av automatiskt efter 2 min.
                          url: /ipcamera/c425_landet_baksida/ipcamera.m3u8
                          type: application/x-mpegURL
                          startManually: false
                          startMuted: true
                          hideControls: false
                          playerType: videojs
                          posterURL: /static/camera-idle.jpg
                          visible: =items.C425_LandetBaksida_Ready.state == 'ON'
    - component: oh-block
      config:
        title: Carport (Huddinge)
      slots:
        default:
          - component: oh-grid-row
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-toggle-card
                        config:
                          title: Carport – C425
                          item: C425_Carport_PermanentStream
                          footer: Batterikamera – PÅ väcker kameran (~10–30 s till bild), AV efter max 2 min.
                      - component: oh-image-card
                        config:
                          url: /static/camera-idle.jpg
                          footer: Kameran sover. Slå PÅ strömmen ovan för att titta.
                          visible: =items.C425_Carport_PermanentStream.state != 'ON'
                      - component: oh-label-card
                        config:
                          label: Väcker kameran…
                          icon: f7:hourglass
                          footer: Bilden kommer när strömmen är igång (10–30 s).
                          visible: =items.C425_Carport_PermanentStream.state == 'ON' && items.C425_Carport_Ready.state != 'ON'
                      - component: oh-video-card
                        config:
                          title: Carport – C425
                          footer: Live (HLS, ~5–10 s fördröjning). Stängs av automatiskt efter 2 min.
                          url: /ipcamera/c425_carport/ipcamera.m3u8
                          type: application/x-mpegURL
                          startManually: false
                          startMuted: true
                          hideControls: false
                          playerType: videojs
                          posterURL: /static/camera-idle.jpg
                          visible: =items.C425_Carport_Ready.state == 'ON'
