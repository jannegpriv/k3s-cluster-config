# Main UI layout page "Kameror" (uid: cameras_landet). Deployed via
# scripts/camera-bridge-page.sh (REST) or pasted into the page editor's Code tab.
# URLs are same-origin (relative) so the page works on every openHAB URL and never
# exposes camera addresses or credentials.
#
# NOTE: an oh-grid-col renders only its FIRST child -> one widget per row/col.
# All cameras show the latest still (conf/html/<cam>-last.jpg, written by cameras.js
# when a stream stops). C425s (battery): tapping the still sends startStream ON; the
# player replaces the still once cameras.js has confirmed the playlist exists
# (<Cam>_Ready). A red button or the 120 s cap stops the stream.
uid: cameras_landet
tags:
  - cameras
props:
  parameters: []
  parameterGroups: []
timestamp: Sep 12, 2026, 4:00:00 PM
component: oh-layout-page
config:
  label: Kameror
  sidebar: true
slots:
  default:
    - component: oh-block
      config:
        title: Lillstugan
      slots:
        default:
          - component: oh-grid-row
            config:
                    {}
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-video-card
                        config:
                          title: Lillstugan – C720
                          footer: HLS via openHAB (~5–10 s fördröjning). Tryck play för att starta.
                          url: /ipcamera/c720_lillstugan/ipcamera.m3u8
                          type: application/x-mpegURL
                          startManually: true
                          startMuted: true
                          hideControls: false
                          playerType: videojs
                          posterURL: /static/c720_lillstugan-last.jpg
          - component: oh-grid-row
            config:
                    {}
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-toggle-card
                        config:
                          title: Permanent ström (nätdriven kamera)
                          item: C720_Lillstugan_PermanentStream
                          footer: PÅ = strömmen hålls igång hela tiden, start utan fördröjning.
    - component: oh-block
      config:
        title: Landet baksida
      slots:
        default:
          - component: oh-grid-row
            config:
                    visible: =items.C425_LandetBaksida_PermanentStream.state != 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-image-card
                        config:
                          title: Landet baksida – C425
                          url: /static/c425_landet_baksida-last.jpg
                          refreshInterval: 60000
                          action: command
                          actionItem: C425_LandetBaksida_PermanentStream
                          actionCommand: "ON"
                          footer: Senaste bild. Tryck på bilden för live (batterikamera – ~10–30 s start, max 2 min).
          - component: oh-grid-row
            config:
                    visible: =items.C425_LandetBaksida_PermanentStream.state == 'ON' && items.C425_LandetBaksida_Ready.state != 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-label-card
                        config:
                          title: Landet baksida – C425
                          label: Väcker kameran…
                          icon: f7:hourglass
                          footer: Bilden kommer när strömmen är igång (10–30 s).
          - component: oh-grid-row
            config:
                    visible: =items.C425_LandetBaksida_Ready.state == 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-video-card
                        config:
                          title: Landet baksida – C425
                          footer: Live (HLS, ~5–10 s fördröjning). Stängs av automatiskt efter 2 min.
                          url: /ipcamera/c425_landet_baksida/ipcamera.m3u8
                          type: application/x-mpegURL
                          startManually: false
                          startMuted: true
                          hideControls: false
                          playerType: videojs
                          posterURL: /static/c425_landet_baksida-last.jpg
          - component: oh-grid-row
            config:
                    visible: =items.C425_LandetBaksida_PermanentStream.state == 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-button
                        config:
                          text: Stoppa strömmen nu
                          fill: true
                          color: red
                          action: command
                          actionItem: C425_LandetBaksida_PermanentStream
                          actionCommand: "OFF"
    - component: oh-block
      config:
        title: Carport (Huddinge)
      slots:
        default:
          - component: oh-grid-row
            config:
                    visible: =items.C425_Carport_PermanentStream.state != 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-image-card
                        config:
                          title: Carport – C425
                          url: /static/c425_carport-last.jpg
                          refreshInterval: 60000
                          action: command
                          actionItem: C425_Carport_PermanentStream
                          actionCommand: "ON"
                          footer: Senaste bild. Tryck på bilden för live (batterikamera – ~10–30 s start, max 2 min).
          - component: oh-grid-row
            config:
                    visible: =items.C425_Carport_PermanentStream.state == 'ON' && items.C425_Carport_Ready.state != 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-label-card
                        config:
                          title: Carport – C425
                          label: Väcker kameran…
                          icon: f7:hourglass
                          footer: Bilden kommer när strömmen är igång (10–30 s).
          - component: oh-grid-row
            config:
                    visible: =items.C425_Carport_Ready.state == 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-video-card
                        config:
                          title: Carport – C425
                          footer: Live (HLS, ~5–10 s fördröjning). Stängs av automatiskt efter 2 min.
                          url: /ipcamera/c425_carport/ipcamera.m3u8
                          type: application/x-mpegURL
                          startManually: false
                          startMuted: true
                          hideControls: false
                          playerType: videojs
                          posterURL: /static/c425_carport-last.jpg
          - component: oh-grid-row
            config:
                    visible: =items.C425_Carport_PermanentStream.state == 'ON'
            slots:
              default:
                - component: oh-grid-col
                  config:
                    width: "100"
                    large: "50"
                  slots:
                    default:
                      - component: oh-button
                        config:
                          text: Stoppa strömmen nu
                          fill: true
                          color: red
                          action: command
                          actionItem: C425_Carport_PermanentStream
                          actionCommand: "OFF"
