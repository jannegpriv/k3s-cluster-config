apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.2
  continueUpgradeAfterChecksEvenIfNotHealthy: true
  crashCollector:
    disable: true
  dashboard:
    enabled: true
    ssl: false
  dataDirHostPath: /var/lib/rook
  # Configuration settings
  cephConfig:
    global:
      auth_allow_insecure_global_id_reclaim: "true"
      ms_client_mode: "crc secure"
      mon_allow_pool_delete: "true"
      mon_max_pg_per_osd: "300"
      # Note: The following settings are managed directly via Ceph tools
      # mon_osd_full_ratio: "0.95"
      # mon_osd_backfillfull_ratio: "0.90"
      # mon_osd_nearfull_ratio: "0.85"
    mon:
      debug_mon: "1/5"
      debug_paxos: "1/5"
      debug_auth: "1/5"
    mgr:
      debug_mgr: "1/5"
      mgr/prometheus/rbd_stats_pools: "replicapool"
    osd:
      debug_osd: "1/5"
      osd_max_backfills: "1"
      osd_recovery_max_active: "1"
      osd_recovery_op_priority: "1"
  
  mgr:
    modules:
    - enabled: true
      name: prometheus
  
  mon:
    # Never put 2 mons on one node — that lost quorum when w-3 died (2026-07).
    allowMultiplePerNode: false
    count: 3
    volumeClaimTemplate:
      spec:
        storageClassName: local-path  # Changed from rook-ceph-block to local-path
        resources:
          requests:
            storage: 25Gi
  
  skipUpgradeChecks: true
  storage:
    # Rook 1.14 ignores node overrides when useAllNodes is true.
    # Explicitly preserve each existing OSD partition and add only w-6's p3.
    useAllDevices: false
    useAllNodes: false
    nodes:
    - name: k3s-m-1
      devices:
      - name: /dev/sda1
    - name: k3s-w-1
      devices:
      - name: /dev/sda3
    - name: k3s-w-3
      devices:
      - name: /dev/nvme0n1p3
    - name: k3s-w-4
      devices:
      - name: /dev/nvme0n1p3
    - name: k3s-w-5
      devices:
      - name: /dev/nvme0n1p3
    - name: k3s-w-6
      devices:
      # Only the reserved 752.8 GiB partition; p1 is Ubuntu and p2 is EFI.
      - name: /dev/nvme0n1p3
  
  placement:
    # Bring storage online while ordinary applications remain blocked on w-6.
    osd:
      tolerations:
      - key: onboarding.k3s.nu/pending
        operator: Equal
        value: "true"
        effect: NoSchedule
    prepareosd:
      tolerations:
      - key: onboarding.k3s.nu/pending
        operator: Equal
        value: "true"
        effect: NoSchedule
    mgr:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - k3s-m-1
    mon:
      # required (not just preferred) → the scheduler will refuse to co-locate
      # mons; with 5 nodes and count 3 each mon lands on a distinct host.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - rook-ceph-mon
          topologyKey: kubernetes.io/hostname
  
  resources:
    mgr:
      limits:
        memory: "1Gi"    # Kept memory limit, removed CPU limit
      requests:
        cpu: "500m"      # Kept CPU request
        memory: "512Mi"
    mon:
      limits:
        memory: "768Mi"  # Kept memory limit, removed CPU limit
      requests:
        cpu: "300m"      # Kept CPU request
        memory: "512Mi"
    osd:
      # Ceph reads POD_MEMORY_REQUEST as osd_memory_target (soft cap; RSS lands
      # ~10-40 % above it). 2Gi -> 1.5Gi on 2026-09-19: three 8 GB nodes sat at
      # 72-77 % with an OSD + openHAB/Prometheus each (NodeHighMemoryUsage >85 %).
      # Limit 3Gi is the hard ceiling (was 4Gi = overcommit on 8 GB nodes).
      limits:
        memory: "3Gi"
      requests:
        cpu: "1"
        memory: "1536Mi"
  
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mon:
        probe:
          initialDelaySeconds: 10
          timeoutSeconds: 30
          periodSeconds: 60
          successThreshold: 1
          failureThreshold: 5
      mgr:
        probe:
          initialDelaySeconds: 10
          timeoutSeconds: 45
          periodSeconds: 90
          successThreshold: 1
          failureThreshold: 6
      osd:
        probe:
          initialDelaySeconds: 10
          timeoutSeconds: 30
          periodSeconds: 60
          successThreshold: 1
          failureThreshold: 5
