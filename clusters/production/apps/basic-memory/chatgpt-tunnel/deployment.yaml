apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-memory-chatgpt-tunnel
  labels:
    app.kubernetes.io/name: basic-memory-chatgpt-tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: basic-memory-chatgpt-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: basic-memory-chatgpt-tunnel
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: tunnel-client
        image: ghcr.io/openai/tunnel-client:v0.0.15@sha256:119799b778ba8411a124f53588f9dc837fd62ba03e5fadf77d675123c92ab58e
        args:
        - --config=/etc/tunnel/config.yaml
        - --control-plane.organization-id=org-Ij9Q17ytubRQMo7EVcVMSvv5
        - --allow-remote-ui=false
        env:
        - name: CONTROL_PLANE_TUNNEL_ID
          valueFrom:
            secretKeyRef:
              name: basic-memory-chatgpt-tunnel
              key: tunnel-id
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - name: health
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/tunnel
          readOnly: true
        - name: credentials
          mountPath: /run/secrets/openai
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: basic-memory-chatgpt-tunnel
      - name: credentials
        secret:
          secretName: basic-memory-chatgpt-tunnel
          defaultMode: 0440
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
