apiVersion: batch/v1
kind: CronJob
metadata:
  name: basic-memory-backup
  namespace: basic-memory
  labels:
    app.kubernetes.io/name: basic-memory
    app.kubernetes.io/instance: basic-memory
spec:
  schedule: 30 3 * * *
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: basic-memory-backup
            app.kubernetes.io/instance: basic-memory
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: basic-memory
                    app.kubernetes.io/instance: basic-memory
                topologyKey: kubernetes.io/hostname
          containers:
          - name: backup
            image: alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
            command:
            - /bin/sh
            - -ec
            args:
            - 'apk add --no-cache python3 openssh-client sshpass

              exec python3 /scripts/backup.py

              '
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ssh
              mountPath: /ssh
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: work
              mountPath: /work
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: basic-memory-data
              readOnly: true
          - name: scripts
            configMap:
              name: basic-memory-backup-scripts
              defaultMode: 365
          - name: ssh
            configMap:
              name: basic-memory-nas-hostkey
          - name: credentials
            secret:
              secretName: basic-memory-nas
              defaultMode: 256
          - name: work
            emptyDir:
              sizeLimit: 6Gi
