apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: basic-memory
  namespace: basic-memory
  labels:
    app.kubernetes.io/name: basic-memory
    app.kubernetes.io/instance: basic-memory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: basic-memory
      app.kubernetes.io/instance: basic-memory
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system
    ports:
    - protocol: TCP
      port: 8000
