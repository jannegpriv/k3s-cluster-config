apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-memory
  namespace: basic-memory
  labels:
    app.kubernetes.io/name: basic-memory
    app.kubernetes.io/instance: basic-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: basic-memory
      app.kubernetes.io/instance: basic-memory
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      initContainers:
      - name: sqlite-index-compat
        image: ghcr.io/basicmachines-co/basic-memory:1.0.0@sha256:cad49f5433bcd8592fea547907a2b967435b3fa60d0f81ebc4d558e2b5cb55a8
        command: [python, /compat/sqlite-index-compat.py, /patched/local_project.py]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: sqlite-compat-script
          mountPath: /compat
          readOnly: true
        - name: sqlite-compat-module
          mountPath: /patched
      containers:
      - name: basic-memory
        image: ghcr.io/basicmachines-co/basic-memory:1.0.0@sha256:cad49f5433bcd8592fea547907a2b967435b3fa60d0f81ebc4d558e2b5cb55a8
        command:
        - /bin/sh
        - -ec
        args:
        - 'mkdir -p /data/memory/profile /data/memory/preferences /data/memory/projects
          /data/config

          exec basic-memory mcp --transport streamable-http --host 0.0.0.0 --port
          8000 --path /mcp --project main

          '
        env:
        - name: BASIC_MEMORY_HOME
          value: /data/memory
        - name: BASIC_MEMORY_PROJECT_ROOT
          value: /data/memory
        - name: BASIC_MEMORY_CONFIG_DIR
          value: /data/config
        - name: BASIC_MEMORY_DEFAULT_PROJECT
          value: main
        - name: BASIC_MEMORY_DATABASE_BACKEND
          value: sqlite
        - name: BASIC_MEMORY_DEFAULT_SEARCH_TYPE
          value: hybrid
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_PROVIDER
          value: fastembed
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_MODEL
          value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_DIMENSIONS
          value: '384'
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_CACHE_DIR
          value: /data/cache/fastembed
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_THREADS
          value: '2'
        - name: BASIC_MEMORY_SEMANTIC_EMBEDDING_PARALLEL
          value: '1'
        - name: BASIC_MEMORY_INDEX_CHANGES
          value: 'true'
        - name: BASIC_MEMORY_LOGFIRE_ENABLED
          value: 'false'
        - name: BASIC_MEMORY_LOGFIRE_SEND_TO_LOGFIRE
          value: 'false'
        - name: BASIC_MEMORY_ENV
          value: user
        - name: TZ
          value: Europe/Stockholm
        ports:
        - name: mcp
          containerPort: 8000
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: sqlite-compat-module
          mountPath: /app/src/basic_memory/index/local_project.py
          subPath: local_project.py
          readOnly: true
        startupProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 180
        readinessProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: sqlite-compat-script
        configMap:
          name: basic-memory-sqlite-compat
      - name: sqlite-compat-module
        emptyDir:
          sizeLimit: 1Mi
      - name: data
        persistentVolumeClaim:
          claimName: basic-memory-data
