- name: Different metrics path is excluded
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
