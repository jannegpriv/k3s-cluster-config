# Run: python3 scripts/test-prometheus-throttling.py
rule_files:
- node-resource-alerts.rules.yaml
evaluation_interval: 1m
tests:
- name: Exactly 25 percent does not fire
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+25x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Incident-like 23.75 percent does not fire
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+95x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+400x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Sustained 30 percent fires only after 15 minutes pending
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 15m
    alertname: NodeCPUThrottling
    exp_alerts: []
  - eval_time: 16m
    alertname: NodeCPUThrottling
    exp_alerts:
    - exp_labels:
        namespace: monitoring
        pod: alertmanager-test-0
        container: alertmanager
        severity: warning
      exp_annotations:
        summary: Containerns CPU begränsas återkommande
        description: Container alertmanager i podden alertmanager-test-0 (namespace
          monitoring) har 30% begränsade CPU-perioder under de senaste 5 minuterna.
          Andelen har varit över 25 % i minst 15 minuter. Detta avser schemaläggningsperioder,
          inte nodens CPU-användning eller förlorad CPU-tid.
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts:
    - exp_labels:
        namespace: monitoring
        pod: alertmanager-test-0
        container: alertmanager
        severity: warning
      exp_annotations:
        summary: Containerns CPU begränsas återkommande
        description: Container alertmanager i podden alertmanager-test-0 (namespace
          monitoring) har 30% begränsade CPU-perioder under de senaste 5 minuterna.
          Andelen har varit över 25 % i minst 15 minuter. Detta avser schemaläggningsperioder,
          inte nodens CPU-användning eller förlorad CPU-tid.
- name: Ten-minute burst does not fire
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x10 300+0x30
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 10m
    alertname: NodeCPUThrottling
    exp_alerts: []
  - eval_time: 15m
    alertname: NodeCPUThrottling
    exp_alerts: []
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Alert resolves when sustained throttling stops
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x20 600+0x20
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 20m
    alertname: NodeCPUThrottling
    exp_alerts:
    - exp_labels:
        namespace: monitoring
        pod: alertmanager-test-0
        container: alertmanager
        severity: warning
      exp_annotations:
        summary: Containerns CPU begränsas återkommande
        description: Container alertmanager i podden alertmanager-test-0 (namespace
          monitoring) har 30% begränsade CPU-perioder under de senaste 5 minuterna.
          Andelen har varit över 25 % i minst 15 minuter. Detta avser schemaläggningsperioder,
          inte nodens CPU-användning eller förlorad CPU-tid.
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Zero denominator cannot cause infinity alert
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Missing denominator does not fire
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Missing numerator does not fire
  interval: 1m
  input_series:
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Counter reset retains valid 30 percent ratio
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x9 0+30x30
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x9 0+100x30
  alert_rule_test:
  - eval_time: 16m
    alertname: NodeCPUThrottling
    exp_alerts:
    - exp_labels:
        namespace: monitoring
        pod: alertmanager-test-0
        container: alertmanager
        severity: warning
      exp_annotations:
        summary: Containerns CPU begränsas återkommande
        description: Container alertmanager i podden alertmanager-test-0 (namespace
          monitoring) har 30% begränsade CPU-perioder under de senaste 5 minuterna.
          Andelen har varit över 25 % i minst 15 minuter. Detta avser schemaläggningsperioder,
          inte nodens CPU-användning eller förlorad CPU-tid.
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts:
    - exp_labels:
        namespace: monitoring
        pod: alertmanager-test-0
        container: alertmanager
        severity: warning
      exp_annotations:
        summary: Containerns CPU begränsas återkommande
        description: Container alertmanager i podden alertmanager-test-0 (namespace
          monitoring) har 30% begränsade CPU-perioder under de senaste 5 minuterna.
          Andelen har varit över 25 % i minst 15 minuter. Detta avser schemaläggningsperioder,
          inte nodens CPU-användning eller förlorad CPU-tid.
- name: Namespaces and pods remain independent
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  - series: container_cpu_cfs_throttled_periods_total{namespace="other",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+10x40
  - series: container_cpu_cfs_periods_total{namespace="other",pod="alertmanager-test-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="healthy-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+10x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="healthy-0",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts:
    - exp_labels:
        namespace: monitoring
        pod: alertmanager-test-0
        container: alertmanager
        severity: warning
      exp_annotations:
        summary: Containerns CPU begränsas återkommande
        description: Container alertmanager i podden alertmanager-test-0 (namespace
          monitoring) har 30% begränsade CPU-perioder under de senaste 5 minuterna.
          Andelen har varit över 25 % i minst 15 minuter. Detta avser schemaläggningsperioder,
          inte nodens CPU-användning eller förlorad CPU-tid.
- name: Empty container is excluded
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: POD infrastructure container is excluded
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Empty pod is excluded
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="",container="alertmanager",job="kubelet",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NodeCPUThrottling
    exp_alerts: []
- name: Different job is excluded
  interval: 1m
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="duplicate-scrape",metrics_path="/metrics/cadvisor"}
    values: 0+30x40
  - series: container_cpu_cfs_periods_total{namespace="monitoring",pod="alertmanager-test-0",container="alertmanager",job="duplicate-scrape",metrics_path="/metrics/cadvisor"}
    values: 0+100x40
  alert_rule_test:
